set noparent
linelength=80
root=include
# Deliberate exceptions:
#  build/c++11            <chrono>/<thread>/<mutex> are allowed by the Google
#                         guide itself; cpplint's list is a Chromium rule.
#  build/include_subdir, legal/copyright  project layout / licence header
#  build/include_what_you_use  fires on .cc files whose own header already
#                         includes <string>, <memory> etc.
#  runtime/int            ioctl() request codes and strtol() are specified in
#                         terms of (unsigned) long by the system headers.
#  whitespace/indent_namespace  false positives on clang-format output
#                         (multi-line initialisers inside namespaces).
filter=-build/c++11,-build/c++tr1,-build/include_subdir,-legal/copyright,-build/include_what_you_use,-runtime/int,-whitespace/indent_namespace
