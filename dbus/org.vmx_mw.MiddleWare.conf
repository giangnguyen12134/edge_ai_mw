<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  System bus policy of the VMX middleware.

  * Only the service user may own the well-known names.
  * Only root and members of the group "vmx-mw-clients" may call the services
    or receive their broadcasts. Result signals can carry personal data (the
    name of the identified speaker), so by default nobody else may eavesdrop.
    Add an application's user to vmx-mw-clients to let it use the middleware:
        sudo usermod -aG vmx-mw-clients <user>
  * FrameReady is unicast to the subscriber and needs no extra rule.
-->
<busconfig>
  <policy user="root">
    <allow own="org.vmx_mw.MediaManager"/>
    <allow own="org.vmx_mw.NpuManager"/>
    <!-- The services are clients of each other and of the bus daemon. -->
    <allow send_destination="org.vmx_mw.MediaManager"/>
    <allow send_destination="org.vmx_mw.NpuManager"/>
    <allow receive_sender="org.vmx_mw.MediaManager"/>
    <allow receive_sender="org.vmx_mw.NpuManager"/>
  </policy>

  <policy user="root">
    <allow send_destination="org.vmx_mw.MediaManager"/>
    <allow send_destination="org.vmx_mw.NpuManager"/>
    <allow receive_sender="org.vmx_mw.MediaManager"/>
    <allow receive_sender="org.vmx_mw.NpuManager"/>
  </policy>

  <policy group="vmx-mw-clients">
    <allow send_destination="org.vmx_mw.MediaManager"/>
    <allow send_destination="org.vmx_mw.NpuManager"/>
    <allow receive_sender="org.vmx_mw.MediaManager"/>
    <allow receive_sender="org.vmx_mw.NpuManager"/>
  </policy>

  <policy context="default">
    <deny own="org.vmx_mw.MediaManager"/>
    <deny own="org.vmx_mw.NpuManager"/>
    <deny send_destination="org.vmx_mw.MediaManager"/>
    <deny send_destination="org.vmx_mw.NpuManager"/>
    <deny receive_sender="org.vmx_mw.MediaManager"/>
    <deny receive_sender="org.vmx_mw.NpuManager"/>
  </policy>
</busconfig>
